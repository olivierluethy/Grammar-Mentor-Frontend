<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grammar Checker - Enhanced</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Grammar Checker Enhanced</h1>
        <p class="subtitle">
          AI-powered grammar checking with learning features
        </p>
      </div>

      <!-- CONTROLS BAR -->
      <div class="controls-bar">
        <div class="control-group">
          <label class="control-label">Language</label>
          <select id="languageSelect">
            <option value="auto">Auto-detect</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="nl">Dutch</option>
            <option value="pl">Polish</option>
            <option value="ru">Russian</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="ar">Arabic</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label">Writing Style</label>
          <select id="styleSelect">
            <option value="neutral">Neutral</option>
            <option value="formal">Formal</option>
            <option value="casual">Casual</option>
            <option value="academic">Academic</option>
            <option value="creative">Creative</option>
            <option value="professional">Professional</option>
            <option value="conversational">Conversational</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label">Tone</label>
          <select id="toneSelect">
            <option value="preserve">Preserve Original</option>
            <option value="natural">More Natural</option>
            <option value="confident">More Confident</option>
            <option value="friendly">More Friendly</option>
            <option value="concise">More Concise</option>
          </select>
        </div>
      </div>

      <div class="main-content">
        <!-- Left side: Text Editor -->
        <div class="editor-section">
          <div class="editor-wrapper">
            <div id="highlightLayer"></div>
            <textarea
              id="textEditor"
              placeholder="Type or paste your text here to check for grammar errors..."
              spellcheck="false"
            ></textarea>
          </div>

          <div class="controls">
            <button id="checkBtn" class="btn btn-primary">Check Grammar</button>
            <button
              id="acceptAllBtn"
              class="btn btn-accept-all"
              style="display: none"
            >
              Accept All
            </button>
            <button id="clearBtn" class="btn btn-ignore">Clear All</button>
            <button
              id="pasteBtn"
              type="button"
              title="Paste from clipboard"
              onclick="
                gtag('event', 'button_click', {
                  button: 'paste',
                  page: 'home',
                  action: 'paste_text',
                })
              "
              class="group flex items-center gap-2 px-4 py-2.5 bg-bg-secondary/70 hover:bg-bg-secondary border border-slate-600/70 hover:border-slate-500 rounded-xl text-text-secondary hover:text-text-primary font-medium text-sm transition-all duration-200 shadow-sm hover:shadow-md active:scale-[0.97]"
            >
              Paste
            </button>
            <button
              id="copyBtn"
              type="button"
              title="Copy to clipboard"
              onclick="
                gtag('event', 'button_click', {
                  button: 'copy',
                  page: 'home',
                  action: 'copy_text',
                })
              "
              class="group flex items-center gap-2 px-4 py-2.5 bg-bg-secondary/70 hover:bg-bg-secondary border border-slate-600/70 hover:border-slate-500 rounded-xl text-text-secondary hover:text-text-primary font-medium text-sm transition-all duration-200 shadow-sm hover:shadow-md active:scale-[0.97]"
            >
              Copy
            </button>
          </div>

          <div class="stats" id="statsSection" style="display: none">
            <div class="stat-item">
              <span class="stat-label">Words</span>
              <span class="stat-value" id="wordCount">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Issues Found</span>
              <span class="stat-value" id="issueCount">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Issues Fixed</span>
              <span class="stat-value" id="fixedCount">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Language</span>
              <span class="stat-value" id="detectedLang" style="font-size: 1rem"
                >--</span
              >
            </div>
          </div>

          <!-- SNIPPET MANAGER -->
          <div class="snippet-manager">
            <div class="snippet-header">
              <span class="snippet-title">📎 Saved Snippets</span>
              <button
                id="toggleSnippets"
                class="btn-snippet"
                style="font-size: 0.75rem; padding: 0.25rem 0.5rem"
              >
                Show/Hide
              </button>
            </div>
            <div id="snippetContainer" style="display: none">
              <div class="snippet-list" id="snippetList">
                <!-- Snippets will be inserted here -->
              </div>
              <div class="snippet-input-container">
                <input
                  type="text"
                  id="snippetInput"
                  class="snippet-input"
                  placeholder="Enter text to save as snippet..."
                />
                <button id="saveSnippetBtn" class="btn btn-snippet">
                  Save Snippet
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Right side: Advice Panel -->
        <div class="advice-section" id="adviceSection">
          <div class="advice-header">
            <h2 class="advice-title">Suggestions</h2>
          </div>
          <div id="advicePanel">
            <div class="empty-state">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                />
              </svg>
              <p>Enter text and click "Check Grammar" to see suggestions</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL FOR GRAMMAR RULES -->
    <div id="ruleModal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="modalTitle">Grammar Rule</h2>
          <button class="modal-close" onclick="closeRuleModal()">
            &times;
          </button>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Dynamic content will be inserted here -->
        </div>
      </div>
    </div>
  </body>
</html>
