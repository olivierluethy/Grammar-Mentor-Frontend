<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Checker - Enhanced</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .subtitle {
            opacity: 0.9;
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        .controls-bar {
            background: #f9fafb;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .control-label {
            font-size: 0.75rem;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select {
            padding: 0.5rem 2rem 0.5rem 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            background: white;
            font-size: 0.875rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 450px;
            gap: 0;
            min-height: 600px;
        }

        .editor-section {
            padding: 2rem;
            border-right: 1px solid #e5e7eb;
        }

        .advice-section {
            background: #f9fafb;
            padding: 2rem;
            overflow-y: auto;
            max-height: 800px;
        }

        .editor-wrapper {
            position: relative;
            width: 100%;
            min-height: 400px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: white;
            transition: border-color 0.3s ease;
        }

        .editor-wrapper:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #textEditor {
            width: 100%;
            min-height: 400px;
            padding: 1.5rem;
            font-size: 1.125rem;
            line-height: 1.8;
            font-family: 'Crimson Pro', serif;
            border: none;
            outline: none;
            resize: vertical;
            background: transparent;
            position: relative;
            z-index: 2;
        }

        #highlightLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 400px;
            padding: 1.5rem;
            font-size: 1.125rem;
            line-height: 1.8;
            font-family: 'Crimson Pro', serif;
            pointer-events: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: transparent;
            overflow: hidden;
            z-index: 1;
        }

        .error-highlight {
            background-color: rgba(239, 68, 68, 0.2);
            border-bottom: 2px wavy #ef4444;
            border-radius: 3px;
            cursor: pointer;
            pointer-events: all;
            transition: all 0.2s ease;
        }

        .error-highlight:hover,
        .error-highlight.emphasized {
            background-color: rgba(239, 68, 68, 0.35);
            transform: scale(1.02);
        }

        .error-highlight.clicked {
            background-color: rgba(239, 68, 68, 0.45);
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .btn {
            padding: 0.875rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-accept {
            background: #10b981;
            color: white;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .btn-accept:hover {
            background: #059669;
        }

        .btn-accept-all {
            background: #10b981;
            color: white;
            padding: 0.875rem 2rem;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .btn-accept-all:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        .btn-accept-all:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-ignore {
            background: #6b7280;
            color: white;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .btn-ignore:hover {
            background: #4b5563;
        }

        .btn-learn {
            background: #3b82f6;
            color: white;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .btn-learn:hover {
            background: #2563eb;
        }

        .btn-snippet {
            background: #8b5cf6;
            color: white;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .btn-snippet:hover {
            background: #7c3aed;
        }

        .advice-card {
            background: white;
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border: 2px solid #e5e7eb;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .advice-card:hover,
        .advice-card.emphasized {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            transform: translateX(4px);
        }

        .advice-card.dismissed {
            opacity: 0;
            transform: scale(0.9);
            max-height: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .advice-error {
            color: #ef4444;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .advice-correction {
            color: #10b981;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .advice-explanation {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .advice-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: #9ca3af;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            opacity: 0.5;
        }

        .controls {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .stats {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
            padding: 1rem;
            background: #f9fafb;
            border-radius: 8px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
        }

        .advice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .advice-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.5rem;
            color: #1f2937;
        }

        /* MODAL STYLES */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 2rem;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #1f2937;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 2rem;
            color: #6b7280;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: #f3f4f6;
            color: #1f2937;
        }

        .modal-body {
            padding: 2rem;
        }

        .rule-section {
            margin-bottom: 2rem;
        }

        .rule-section h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 1rem;
        }

        .rule-section p {
            color: #4b5563;
            line-height: 1.7;
            margin-bottom: 1rem;
        }

        .examples-grid {
            display: grid;
            gap: 1rem;
            margin-top: 1rem;
        }

        .example-item {
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid;
        }

        .example-item.correct {
            background: #d1fae5;
            border-left-color: #10b981;
        }

        .example-item.incorrect {
            background: #fee2e2;
            border-left-color: #ef4444;
        }

        .example-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .example-item.correct .example-label {
            color: #065f46;
        }

        .example-item.incorrect .example-label {
            color: #991b1b;
        }

        .example-text {
            font-family: 'Crimson Pro', serif;
            font-size: 1rem;
            color: #1f2937;
        }

        /* SNIPPET MANAGER */
        .snippet-manager {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f9fafb;
            border-radius: 8px;
            border: 2px dashed #d1d5db;
        }

        .snippet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .snippet-title {
            font-weight: 600;
            color: #1f2937;
        }

        .snippet-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .snippet-item {
            background: white;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .snippet-item:hover {
            border-color: #8b5cf6;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.1);
        }

        .snippet-text {
            flex: 1;
            font-size: 0.875rem;
            color: #4b5563;
            cursor: pointer;
        }

        .snippet-actions {
            display: flex;
            gap: 0.5rem;
        }

        .snippet-btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .snippet-btn.insert {
            background: #8b5cf6;
            color: white;
        }

        .snippet-btn.insert:hover {
            background: #7c3aed;
        }

        .snippet-btn.delete {
            background: #ef4444;
            color: white;
        }

        .snippet-btn.delete:hover {
            background: #dc2626;
        }

        .snippet-input-container {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .snippet-input {
            flex: 1;
            padding: 0.5rem;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .snippet-input:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .editor-section {
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Grammar Checker Enhanced</h1>
            <p class="subtitle">AI-powered grammar checking with learning features</p>
        </div>

        <!-- CONTROLS BAR -->
        <div class="controls-bar">
            <div class="control-group">
                <label class="control-label">Language</label>
                <select id="languageSelect">
                    <option value="auto">Auto-detect</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="nl">Dutch</option>
                    <option value="pl">Polish</option>
                    <option value="ru">Russian</option>
                    <option value="zh">Chinese</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="ar">Arabic</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">Writing Style</label>
                <select id="styleSelect">
                    <option value="neutral">Neutral</option>
                    <option value="formal">Formal</option>
                    <option value="casual">Casual</option>
                    <option value="academic">Academic</option>
                    <option value="creative">Creative</option>
                    <option value="professional">Professional</option>
                    <option value="conversational">Conversational</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">Tone</label>
                <select id="toneSelect">
                    <option value="preserve">Preserve Original</option>
                    <option value="natural">More Natural</option>
                    <option value="confident">More Confident</option>
                    <option value="friendly">More Friendly</option>
                    <option value="concise">More Concise</option>
                </select>
            </div>
        </div>

        <div class="main-content">
            <!-- Left side: Text Editor -->
            <div class="editor-section">
                <div class="editor-wrapper">
                    <div id="highlightLayer"></div>
                    <textarea 
                        id="textEditor" 
                        placeholder="Type or paste your text here to check for grammar errors..."
                        spellcheck="false"
                    ></textarea>
                </div>

                <div class="controls">
                    <button id="checkBtn" class="btn btn-primary">
                        Check Grammar
                    </button>
                    <button id="acceptAllBtn" class="btn btn-accept-all" style="display: none;">
                        Accept All
                    </button>
                    <button id="clearBtn" class="btn btn-ignore">
                        Clear All
                    </button>
                </div>

                <div class="stats" id="statsSection" style="display: none;">
                    <div class="stat-item">
                        <span class="stat-label">Words</span>
                        <span class="stat-value" id="wordCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Issues Found</span>
                        <span class="stat-value" id="issueCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Issues Fixed</span>
                        <span class="stat-value" id="fixedCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Language</span>
                        <span class="stat-value" id="detectedLang" style="font-size: 1rem;">--</span>
                    </div>
                </div>

                <!-- SNIPPET MANAGER -->
                <div class="snippet-manager">
                    <div class="snippet-header">
                        <span class="snippet-title">📎 Saved Snippets</span>
                        <button id="toggleSnippets" class="btn-snippet" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;">
                            Show/Hide
                        </button>
                    </div>
                    <div id="snippetContainer" style="display: none;">
                        <div class="snippet-list" id="snippetList">
                            <!-- Snippets will be inserted here -->
                        </div>
                        <div class="snippet-input-container">
                            <input 
                                type="text" 
                                id="snippetInput" 
                                class="snippet-input" 
                                placeholder="Enter text to save as snippet..."
                            >
                            <button id="saveSnippetBtn" class="btn btn-snippet">
                                Save Snippet
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right side: Advice Panel -->
            <div class="advice-section" id="adviceSection">
                <div class="advice-header">
                    <h2 class="advice-title">Suggestions</h2>
                </div>
                <div id="advicePanel">
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <p>Enter text and click "Check Grammar" to see suggestions</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL FOR GRAMMAR RULES -->
    <div id="ruleModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Grammar Rule</h2>
                <button class="modal-close" onclick="closeRuleModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic content will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // STATE MANAGEMENT
        // ========================================
        let corrections = [];
        let fixedCount = 0;
        let snippets = JSON.parse(localStorage.getItem('grammarSnippets') || '[]');
        const API_ENDPOINT = 'subscribe.php';

        // ========================================
        // DOM ELEMENTS
        // ========================================
        const textEditor = document.getElementById('textEditor');
        const highlightLayer = document.getElementById('highlightLayer');
        const checkBtn = document.getElementById('checkBtn');
        const acceptAllBtn = document.getElementById('acceptAllBtn');
        const clearBtn = document.getElementById('clearBtn');
        const advicePanel = document.getElementById('advicePanel');
        const adviceSection = document.getElementById('adviceSection');
        const statsSection = document.getElementById('statsSection');
        const wordCount = document.getElementById('wordCount');
        const issueCount = document.getElementById('issueCount');
        const fixedCountEl = document.getElementById('fixedCount');
        const detectedLang = document.getElementById('detectedLang');
        const languageSelect = document.getElementById('languageSelect');
        const styleSelect = document.getElementById('styleSelect');
        const toneSelect = document.getElementById('toneSelect');
        const ruleModal = document.getElementById('ruleModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        // Snippet elements
        const toggleSnippets = document.getElementById('toggleSnippets');
        const snippetContainer = document.getElementById('snippetContainer');
        const snippetList = document.getElementById('snippetList');
        const snippetInput = document.getElementById('snippetInput');
        const saveSnippetBtn = document.getElementById('saveSnippetBtn');

        // ========================================
        // EVENT LISTENERS
        // ========================================
        
        textEditor.addEventListener('scroll', () => {
            highlightLayer.scrollTop = textEditor.scrollTop;
            highlightLayer.scrollLeft = textEditor.scrollLeft;
        });

        textEditor.addEventListener('input', () => {
            updateWordCount();
        });

        checkBtn.addEventListener('click', async () => {
            const text = textEditor.value.trim();
            if (!text) {
                alert('Please enter some text to check.');
                return;
            }
            await checkGrammar(text);
        });

        acceptAllBtn.addEventListener('click', () => {
            acceptAllCorrections();
        });

        clearBtn.addEventListener('click', () => {
            textEditor.value = '';
            corrections = [];
            fixedCount = 0;
            renderHighlights();
            renderAdvicePanel();
            updateStats();
            statsSection.style.display = 'none';
            acceptAllBtn.style.display = 'none';
        });

        // Snippet management
        toggleSnippets.addEventListener('click', () => {
            snippetContainer.style.display = 
                snippetContainer.style.display === 'none' ? 'block' : 'none';
        });

        saveSnippetBtn.addEventListener('click', () => {
            const text = snippetInput.value.trim();
            if (text) {
                snippets.push(text);
                localStorage.setItem('grammarSnippets', JSON.stringify(snippets));
                snippetInput.value = '';
                renderSnippets();
            }
        });

        // Close modal on background click
        ruleModal.addEventListener('click', (e) => {
            if (e.target === ruleModal) {
                closeRuleModal();
            }
        });

        // ========================================
        // MAIN GRAMMAR CHECKING FUNCTION
        // ========================================
        async function checkGrammar(text) {
            checkBtn.disabled = true;
            checkBtn.textContent = 'Checking...';
            acceptAllBtn.style.display = 'none';
            advicePanel.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Analyzing your text...</p>
                </div>
            `;

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        text: text,
                        language: languageSelect.value,
                        style: styleSelect.value,
                        tone: toneSelect.value
                    })
                });

                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                corrections = data.corrections || [];
                fixedCount = 0;

                // Update detected language
                if (data.detected_language) {
                    detectedLang.textContent = data.detected_language.toUpperCase();
                }

                renderHighlights();
                renderAdvicePanel();
                updateStats();
                statsSection.style.display = 'flex';
                
                if (corrections.length > 0) {
                    acceptAllBtn.style.display = 'block';
                }

            } catch (error) {
                console.error('Error:', error);
                advicePanel.innerHTML = `
                    <div class="empty-state">
                        <p style="color: #ef4444; font-weight: 600;">Error: ${error.message}</p>
                        <p style="margin-top: 1rem; font-size: 0.9rem;">Please check your API configuration and try again.</p>
                    </div>
                `;
            } finally {
                checkBtn.disabled = false;
                checkBtn.textContent = 'Check Grammar';
            }
        }

        // ========================================
        // RENDERING FUNCTIONS
        // ========================================
        
        function renderHighlights() {
            const text = textEditor.value;
            
            if (corrections.length === 0) {
                highlightLayer.innerHTML = '';
                return;
            }

            let htmlParts = [];
            let currentPos = 0;

            const sortedCorrections = [...corrections]
                .filter(c => !c.ignored)
                .sort((a, b) => a.position - b.position);

            sortedCorrections.forEach((correction) => {
                const start = correction.position;
                const end = start + correction.original.length;

                if (currentPos < start) {
                    htmlParts.push(escapeHtml(text.substring(currentPos, start)));
                }

                const actualIndex = corrections.indexOf(correction);

                htmlParts.push(
                    `<span class="error-highlight" data-index="${actualIndex}" ` +
                    `onmouseover="onHighlightHover(${actualIndex})" ` +
                    `onmouseout="onHighlightLeave(${actualIndex})" ` +
                    `onclick="clickHighlight(${actualIndex})">${escapeHtml(correction.original)}</span>`
                );

                currentPos = end;
            });

            if (currentPos < text.length) {
                htmlParts.push(escapeHtml(text.substring(currentPos)));
            }

            highlightLayer.innerHTML = htmlParts.join('');
        }

        function renderAdvicePanel() {
            if (corrections.length === 0) {
                advicePanel.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <p style="color: #10b981; font-weight: 600;">No issues found!</p>
                        <p style="margin-top: 0.5rem;">Your text looks great.</p>
                    </div>
                `;
                acceptAllBtn.style.display = 'none';
                return;
            }

            const activeCorrections = corrections.filter(c => !c.ignored);
            
            if (activeCorrections.length === 0) {
                advicePanel.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <p style="color: #10b981; font-weight: 600;">All suggestions handled!</p>
                    </div>
                `;
                acceptAllBtn.style.display = 'none';
                return;
            }

            advicePanel.innerHTML = activeCorrections.map(correction => {
                const actualIndex = corrections.indexOf(correction);
                return `
                    <div class="advice-card" id="advice-${actualIndex}" 
                         data-index="${actualIndex}"
                         onmouseover="highlightText(${actualIndex})"
                         onmouseout="unhighlightText(${actualIndex})">
                        <div class="advice-error">
                            <strong>Issue:</strong> "${escapeHtml(correction.original)}"
                        </div>
                        <div class="advice-correction">
                            <strong>Suggestion:</strong> "${escapeHtml(correction.correction)}"
                        </div>
                        <div class="advice-explanation">
                            <strong>Reason:</strong> ${escapeHtml(correction.explanation)}
                        </div>
                        <div class="advice-actions">
                            <button class="btn btn-learn" onclick="showGrammarRule(${actualIndex})">
                                📚 Learn More
                            </button>
                            <button class="btn btn-accept" onclick="acceptCorrection(${actualIndex})">
                                Accept
                            </button>
                            <button class="btn btn-ignore" onclick="ignoreCorrection(${actualIndex})">
                                Ignore
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ========================================
        // CORRECTION HANDLING
        // ========================================
        
        function acceptCorrection(index) {
            const correction = corrections[index];
            if (!correction || correction.ignored) return;

            const text = textEditor.value;
            const start = correction.position;
            const end = start + correction.original.length;

            const newText = text.substring(0, start) + correction.correction + text.substring(end);
            textEditor.value = newText;

            const lengthDiff = correction.correction.length - correction.original.length;

            corrections.forEach((c, i) => {
                if (i !== index && c.position > start && !c.ignored) {
                    c.position += lengthDiff;
                }
            });

            correction.ignored = true;
            fixedCount++;

            const card = document.getElementById(`advice-${index}`);
            if (card) {
                card.classList.add('dismissed');
            }

            setTimeout(() => {
                renderHighlights();
                renderAdvicePanel();
                updateStats();
            }, 300);
        }

        function acceptAllCorrections() {
            if (corrections.length === 0) return;

            const activeCorrections = corrections
                .map((c, index) => ({ ...c, originalIndex: index }))
                .filter(c => !c.ignored)
                .sort((a, b) => b.position - a.position);

            if (activeCorrections.length === 0) return;

            let text = textEditor.value;

            activeCorrections.forEach(correction => {
                const start = correction.position;
                const end = start + correction.original.length;
                
                text = text.substring(0, start) + correction.correction + text.substring(end);
                
                corrections[correction.originalIndex].ignored = true;
                fixedCount++;
            });

            textEditor.value = text;

            renderHighlights();
            renderAdvicePanel();
            updateStats();
        }

        function ignoreCorrection(index) {
            corrections[index].ignored = true;

            const card = document.getElementById(`advice-${index}`);
            if (card) {
                card.classList.add('dismissed');
            }

            setTimeout(() => {
                renderHighlights();
                renderAdvicePanel();
                updateStats();
            }, 300);
        }

        // ========================================
        // BIDIRECTIONAL HOVER & SCROLL SYNC
        // ========================================
        
        /**
         * NEW: When hovering over highlighted text in editor
         * → Scroll to and emphasize the corresponding advice card
         */
        function onHighlightHover(index) {
            const card = document.getElementById(`advice-${index}`);
            if (card) {
                card.classList.add('emphasized');
                // SCROLL THE ADVICE PANEL TO SHOW THIS CARD
                card.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'center',
                    inline: 'nearest'
                });
            }
        }

        function onHighlightLeave(index) {
            const card = document.getElementById(`advice-${index}`);
            if (card) {
                card.classList.remove('emphasized');
            }
        }

        /**
         * When hovering over advice card
         * → Emphasize the corresponding text highlight
         */
        function highlightText(index) {
            const highlights = document.querySelectorAll(`.error-highlight[data-index="${index}"]`);
            highlights.forEach(h => h.classList.add('emphasized'));
        }

        function unhighlightText(index) {
            const highlights = document.querySelectorAll(`.error-highlight[data-index="${index}"]`);
            highlights.forEach(h => h.classList.remove('emphasized'));
        }

        function clickHighlight(index) {
            const highlights = document.querySelectorAll(`.error-highlight[data-index="${index}"]`);
            highlights.forEach(h => h.classList.add('clicked'));
            setTimeout(() => {
                highlights.forEach(h => h.classList.remove('clicked'));
            }, 500);

            const card = document.getElementById(`advice-${index}`);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.classList.add('emphasized');
                setTimeout(() => card.classList.remove('emphasized'), 1000);
            }
        }

        // ========================================
        // GRAMMAR RULE MODAL
        // ========================================
        
        async function showGrammarRule(index) {
            const correction = corrections[index];
            if (!correction) return;

            modalTitle.textContent = 'Grammar Rule: ' + (correction.rule_name || 'Grammar Error');
            modalBody.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading detailed explanation...</p>
                </div>
            `;
            ruleModal.classList.add('active');

            try {
                // Request detailed rule from API
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        action: 'get_rule',
                        correction: correction
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                const rule = data.rule;

                modalBody.innerHTML = `
                    <div class="rule-section">
                        <h3>📖 Rule Explanation</h3>
                        <p>${escapeHtml(rule.explanation || correction.explanation)}</p>
                    </div>

                    <div class="rule-section">
                        <h3>✅ Correct Examples</h3>
                        <div class="examples-grid">
                            ${(rule.correct_examples || []).map(ex => `
                                <div class="example-item correct">
                                    <div class="example-label">✓ Correct</div>
                                    <div class="example-text">${escapeHtml(ex)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="rule-section">
                        <h3>❌ Incorrect Examples</h3>
                        <div class="examples-grid">
                            ${(rule.incorrect_examples || []).map(ex => `
                                <div class="example-item incorrect">
                                    <div class="example-label">✗ Incorrect</div>
                                    <div class="example-text">${escapeHtml(ex)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    ${rule.quiz ? `
                        <div class="rule-section">
                            <h3>🎯 Quick Quiz</h3>
                            <p><strong>Question:</strong> ${escapeHtml(rule.quiz.question)}</p>
                            <div class="examples-grid" style="margin-top: 1rem;">
                                ${rule.quiz.options.map((opt, i) => `
                                    <div class="example-item" style="cursor: pointer; border-left-color: #6b7280;" 
                                         onclick="checkQuizAnswer(${i}, ${rule.quiz.correct})">
                                        <div class="example-text">${String.fromCharCode(65 + i)}. ${escapeHtml(opt)}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                `;

            } catch (error) {
                console.error('Error loading rule:', error);
                modalBody.innerHTML = `
                    <div class="rule-section">
                        <h3>📖 Rule Explanation</h3>
                        <p>${escapeHtml(correction.explanation)}</p>
                        <p style="margin-top: 1rem; color: #ef4444; font-size: 0.875rem;">
                            Could not load detailed examples. ${error.message}
                        </p>
                    </div>
                `;
            }
        }

        function checkQuizAnswer(selected, correct) {
            if (selected === correct) {
                alert('✅ Correct! Well done!');
            } else {
                alert('❌ Not quite. The correct answer is option ' + String.fromCharCode(65 + correct) + '.');
            }
        }

        function closeRuleModal() {
            ruleModal.classList.remove('active');
        }

        // ========================================
        // SNIPPET MANAGEMENT
        // ========================================
        
        function renderSnippets() {
            if (snippets.length === 0) {
                snippetList.innerHTML = '<p style="text-align: center; color: #9ca3af; padding: 1rem;">No snippets saved yet.</p>';
                return;
            }

            snippetList.innerHTML = snippets.map((snippet, index) => `
                <div class="snippet-item">
                    <div class="snippet-text" onclick="insertSnippet(${index})">
                        ${escapeHtml(snippet.substring(0, 60))}${snippet.length > 60 ? '...' : ''}
                    </div>
                    <div class="snippet-actions">
                        <button class="snippet-btn insert" onclick="insertSnippet(${index})">Insert</button>
                        <button class="snippet-btn delete" onclick="deleteSnippet(${index})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function insertSnippet(index) {
            const snippet = snippets[index];
            const cursorPos = textEditor.selectionStart;
            const textBefore = textEditor.value.substring(0, cursorPos);
            const textAfter = textEditor.value.substring(cursorPos);
            
            textEditor.value = textBefore + snippet + textAfter;
            textEditor.selectionStart = textEditor.selectionEnd = cursorPos + snippet.length;
            textEditor.focus();
            updateWordCount();
        }

        function deleteSnippet(index) {
            if (confirm('Delete this snippet?')) {
                snippets.splice(index, 1);
                localStorage.setItem('grammarSnippets', JSON.stringify(snippets));
                renderSnippets();
            }
        }

        // ========================================
        // STATISTICS
        // ========================================
        
        function updateStats() {
            updateWordCount();
            const activeIssues = corrections.filter(c => !c.ignored).length;
            issueCount.textContent = activeIssues;
            fixedCountEl.textContent = fixedCount;

            if (activeIssues === 0) {
                acceptAllBtn.style.display = 'none';
            }
        }

        function updateWordCount() {
            const text = textEditor.value.trim();
            const words = text ? text.split(/\s+/).length : 0;
            wordCount.textContent = words;
        }

        // ========================================
        // UTILITY
        // ========================================
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========================================
        // INITIALIZATION
        // ========================================
        updateWordCount();
        renderSnippets();
    </script>
</body>
</html>
